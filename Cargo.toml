[workspace]
resolver = "3"
exclude = ["apps/desktop/src-tauri"]
members = ["crates/download-engine", "crates/desktop-bridge", "crates/runtime-types", "crates/runtime-api", "crates/runtime-cli", "crates/runtime-ipc", "crates/process-host", "crates/runtime-worker", "crates/runtime-core", "crates/model-store", "crates/engine-host", "crates/llama-adapter", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
fs2 = "0.4"
cap-std = "3.4"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }

axum = { version = "0.8", features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
hyper = { version = "=1.11.1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "service", "server", "http1", "client"] }
http-body-util = "0.1"
bytes = "1"
tower = { version = "0.5", features = ["util"] }
hmac = "0.12"
subtle = "2"
getrandom = "0.4"
toml = "0.9"
