[workspace]
resolver = "3"
members = ["crates/runtime-types", "crates/runtime-core", "crates/model-store", "crates/engine-host", "crates/llama-adapter", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
fs2 = "0.4"
cap-std = "3.4"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
