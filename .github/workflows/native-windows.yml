name: Windows CPU native and runtime verification

on:
  push:
    branches: ['codex/nexa-native-baseline']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      AIR_NATIVE_DIR: ${{ github.workspace }}/build/native-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install fixed development tools
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/verification | Out-Null
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy 2>&1 | Tee-Object -FilePath artifacts/verification/windows-rust-setup.log
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed' }
          python -m pip install cmake==4.4.3 ninja==1.13.2 2>&1 | Tee-Object -FilePath artifacts/verification/windows-cmake-setup.log
          if ($LASTEXITCODE -ne 0) { throw 'CMake setup failed' }
          python -X warn_default_encoding -W error::EncodingWarning -m unittest discover -s scripts -p 'test_*.py' 2>&1 | Tee-Object -FilePath artifacts/verification/windows-upstream-runner-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Upstream process harness tests failed' }
          $threads = [Math]::Max(1, [Math]::Min(4, [Environment]::ProcessorCount))
          "NEXA_TEST_THREADS=$threads" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Inference threads=$threads; available=$([Environment]::ProcessorCount)"
          rustc --version
          cargo --version
          cmake --version
          New-Item -ItemType Directory -Force artifacts/verification | Out-Null
      - name: Build management harness without native libraries
        run: |
          $ErrorActionPreference = 'Stop'
          $env:AIR_NATIVE_DIR = Join-Path $PWD 'deliberately-absent-native-libraries'
          cargo tree --locked -p process-host --edges normal 2>&1 | Tee-Object -FilePath artifacts/verification/windows-process-host-dependencies.log
          if ($LASTEXITCODE -ne 0) { throw 'Management dependency graph failed' }
          if (Select-String -Path artifacts/verification/windows-process-host-dependencies.log -Pattern 'engine-host|llama-adapter|runtime-worker') { throw 'Management process links native inference dependency' }
          cargo build --locked -p process-host --bin nexa-process-harness 2>&1 | Tee-Object -FilePath artifacts/verification/windows-management-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Independent management build failed' }
      - name: Build pinned upstream and shim
        id: native_build
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S native/llama-shim -B build/native-release -G 'Visual Studio 17 2022' -A x64 2>&1 | Tee-Object -FilePath artifacts/verification/windows-configure.log
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build build/native-release --config Release --target air_llama air-stream-test llama-completion llama-bench --parallel 4 2>&1 | Tee-Object -FilePath artifacts/verification/windows-native-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }
          ctest --test-dir build/native-release -C Release --output-on-failure 2>&1 | Tee-Object -FilePath artifacts/verification/windows-ctest.log
          if ($LASTEXITCODE -ne 0) { throw 'Native stream test failed' }
      - name: Check Rust and build real-model verifier
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --all -- --check 2>&1 | Tee-Object -FilePath artifacts/verification/windows-rustfmt.log
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
          cargo test --locked --workspace -- --test-threads=1 2>&1 | Tee-Object -FilePath artifacts/verification/windows-rust-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Unit or documentation tests failed' }
          cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 | Tee-Object -FilePath artifacts/verification/windows-clippy.log
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
          cargo build --locked -p llama-adapter --example native-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Smoke build failed' }
          cargo build --locked -p runtime-worker --bin ai-runtime-worker
          if ($LASTEXITCODE -ne 0) { throw 'Worker build failed' }
      - name: Download exact public test model and verify identity
        id: model_identity
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = Get-Content -Raw tests/fixtures/baseline.json | ConvertFrom-Json
          New-Item -ItemType Directory -Force models | Out-Null
          $uri = "$($baseline.model.source)/resolve/$($baseline.model.revision)/$($baseline.model.filename)"
          curl.exe --fail --location --retry 3 $uri --output models/qa-small.gguf
          if ($LASTEXITCODE -ne 0) { throw 'Model download failed' }
          $actual = (Get-FileHash models/qa-small.gguf -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $baseline.model.sha256) { throw 'Model SHA256 mismatch' }
          cargo run --locked -p xtask -- baseline-verify --model models/qa-small.gguf --device github-actions-windows-2022 --out artifacts/verification/windows-baseline.json
          if ($LASTEXITCODE -ne 0) { throw 'Baseline identity failed' }
      - name: Run upstream Windows CPU baseline
        timeout-minutes: 14
        run: |
          $ErrorActionPreference = 'Stop'
          $completion = (Get-ChildItem build/native-release -Recurse -Filter llama-completion.exe | Select-Object -First 1).FullName
          $bench = (Get-ChildItem build/native-release -Recurse -Filter llama-bench.exe | Select-Object -First 1).FullName
          if (!$completion -or !$bench) { throw 'Upstream executable missing' }
          python scripts/run_upstream_baseline.py --completion $completion --bench $bench --model models/qa-small.gguf --prompt-file tests/fixtures/upstream-prompt-zh.txt --out-dir artifacts/verification --timeout-seconds 300 --threads $env:NEXA_TEST_THREADS --diagnostic-threads 1 4
          if ($LASTEXITCODE -ne 0) { throw 'Upstream bounded baseline failed; inspect upstream-processes.json and logs' }
      - name: Run real-model native suite
        if: ${{ !cancelled() && steps.model_identity.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          cargo run --locked -p xtask -- native-smoke --model models/qa-small.gguf --bin target/debug/examples/native-smoke.exe --device github-actions-windows-2022 --out artifacts/verification/windows-native-smoke.json --threads $env:NEXA_TEST_THREADS --timeout-seconds 90
          if ($LASTEXITCODE -ne 0) { throw 'Real-model native suite failed' }
      - name: Verify real-model stop and lifecycle recovery
        if: ${{ !cancelled() && steps.model_identity.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          $env:NEXA_TEST_MODEL = Join-Path $PWD 'models/qa-small.gguf'
          cargo test --locked -p llama-adapter --test real_model -- --ignored --test-threads=1 --nocapture 2>&1 | Tee-Object -FilePath artifacts/verification/windows-real-model.log
          if ($LASTEXITCODE -ne 0) { throw 'Real-model recovery tests failed' }
      - name: Verify real model-store and runtime scheduling
        if: ${{ !cancelled() && steps.model_identity.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          $env:NEXA_TEST_MODEL = Join-Path $PWD 'models/qa-small.gguf'
          $env:NEXA_TEST_THREADS = '2'
          cargo test --locked -p engine-host --test real_runtime -- --ignored --test-threads=1 --nocapture 2>&1 | Tee-Object -FilePath artifacts/verification/windows-real-runtime.log
          if ($LASTEXITCODE -ne 0) { throw 'Real model-store/runtime integration failed' }
      - name: Verify real worker credit and cancellation
        if: ${{ !cancelled() && steps.model_identity.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          $env:NEXA_TEST_MODEL = Join-Path $PWD 'models/qa-small.gguf'
          $env:NEXA_TEST_THREADS = '2'
          cargo test --locked -p runtime-worker --test real_credit -- --ignored --test-threads=1 --nocapture 2>&1 | Tee-Object -FilePath artifacts/verification/windows-worker-real-credit.log
          if ($LASTEXITCODE -ne 0) { throw 'Real worker credit/cancellation integration failed' }
      - name: Verify real isolated management and worker runtime
        if: ${{ !cancelled() && steps.model_identity.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          $worker = Join-Path $PWD 'target/debug/ai-runtime-worker.exe'
          $model = Join-Path $PWD 'models/qa-small.gguf'
          & (Join-Path $PWD 'target/debug/nexa-process-harness.exe') real $worker $model 2>&1 | Tee-Object -FilePath artifacts/verification/windows-real-process-runtime.log
          if ($LASTEXITCODE -ne 0) { throw 'Isolated management/worker real-model integration failed' }
      - name: Record reusable compiled-tool hashes
        id: native_manifest
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          $files = @(Get-ChildItem build/native-release -Recurse -File | Where-Object { $_.Extension -eq '.lib' -or $_.Name -in @('llama-completion.exe', 'llama-bench.exe', 'air-stream-test.exe') })
          if (Test-Path target/debug/examples/native-smoke.exe) { $files += Get-Item target/debug/examples/native-smoke.exe }
          $entries = foreach ($file in $files) {
            @{ path = [IO.Path]::GetRelativePath($PWD, $file.FullName).Replace('\', '/'); sha256 = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); size_bytes = $file.Length }
          }
          @{ schema_version = 1; project_commit = $env:GITHUB_SHA; files = @($entries) } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 artifacts/verification/native-build-manifest.json
      - name: Preserve compiled diagnostic tools
        if: ${{ failure() && !cancelled() && steps.native_manifest.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-native-tools-${{ github.sha }}
          path: |
            artifacts/verification/native-build-manifest.json
            build/native-release/**/*.lib
            build/native-release/**/llama-completion.exe
            build/native-release/**/llama-bench.exe
            build/native-release/**/air-stream-test.exe
            target/debug/examples/native-smoke.exe
          retention-days: 7
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-cpu-native-${{ github.sha }}
          path: artifacts/verification/
          if-no-files-found: warn
          retention-days: 14
