name: Bounded Windows aria2 sidecar observation

on:
  push:
    branches: ['codex/nexa-native-baseline']
    paths:
      - 'scripts/probe_aria2_windows.py'
      - 'scripts/test_aria2_windows.py'
      - '.github/workflows/aria2-windows-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify fixture and wrapper offline
        run: python -X warn_default_encoding -W error::EncodingWarning -m unittest discover -s scripts -p test_aria2_windows.py
      - name: Observe pinned official sidecar against loopback fixtures only
        run: python scripts/probe_aria2_windows.py --output artifacts/aria2-windows-probe.json
      - name: Upload sanitized observations only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: aria2-windows-probe-${{ github.sha }}
          path: artifacts/aria2-windows-probe.json
          if-no-files-found: error
          retention-days: 14
