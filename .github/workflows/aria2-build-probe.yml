name: Pinned Nexa aria2 Windows build and policy probe

on:
  push:
    branches: ['codex/nexa-native-baseline', 'codex/nexa-aria2-build']
    paths:
      - 'third_party/aria2/**'
      - 'scripts/build_aria2_windows.*'
      - 'scripts/test_aria2_build*.py'
      - '.github/workflows/aria2-build-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline build-contract tests
        run: python3 -X warn_default_encoding -W error::EncodingWarning -m unittest discover -s scripts -p 'test_aria2_build*.py'
      - name: Build pinned source as Windows AMD64 PE with Schannel
        run: bash scripts/build_aria2_windows.sh "$RUNNER_TEMP/aria2-build"
      - name: Linux payload bounds and IOFile regression fixtures
        run: bash third_party/aria2/tests/run_linux_payload.sh "$RUNNER_TEMP/aria2-build"
      - name: Retain build materials and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: aria2-pinned-build-${{ github.sha }}
          path: ${{ runner.temp }}/aria2-build/artifacts/
          if-no-files-found: error
          retention-days: 14
  windows-policy:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          name: aria2-pinned-build-${{ github.sha }}
          path: artifacts/aria2-build
      - name: Real Windows native policy, private socket and Schannel tests
        run: python third_party/aria2/tests/windows_probe.py --artifacts artifacts/aria2-build --output artifacts/aria2-windows-policy.json
      - name: Retain Windows observations separately from untested build artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: aria2-pinned-windows-policy-${{ github.sha }}
          path: artifacts/aria2-windows-policy.json
          if-no-files-found: error
          retention-days: 14
