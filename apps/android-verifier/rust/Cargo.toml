[package]
name = "nexa_device_verifier"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
[workspace]
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
[dependencies]
flutter_rust_bridge = "=2.13.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
uuid = { version = "=1.26.1", features = ["v4"] }
libc = "=0.2.189"
mnn-adapter = { path = "../../../mobile/runtime/crates/mnn-adapter" }
mnn-model-store = { path = "../../../mobile/runtime/crates/mnn-model-store" }
mnn-executor = { path = "../../../mobile/runtime/crates/mnn-executor" }
runtime-core = { path = "../../../crates/runtime-core" }
runtime-types = { path = "../../../crates/runtime-types" }
[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.21.1"
[dev-dependencies]
tempfile = "=3.27.0"
[profile.dev]
debug = 0
incremental = false
[profile.release]
debug = 0
strip = "debuginfo"
lto = false
codegen-units = 16
