// Read-only resolution of the actual packaged release dependency artifacts.
gradle.projectsEvaluated {
    def app = rootProject.findProject(':app')
    if (app == null) return
    app.tasks.register('verifierRuntimeInventory') {
        doLast {
            def files = app.configurations.getByName('releaseRuntimeClasspath').resolvedConfiguration.resolvedArtifacts.collect { artifact ->
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                artifact.file.withInputStream { stream ->
                    byte[] buffer = new byte[65536]
                    int n
                    while ((n = stream.read(buffer)) > 0) digest.update(buffer, 0, n)
                }
                [coordinate: artifact.moduleVersion.id.toString(), type: artifact.type,
                 file: artifact.file.canonicalPath, sha256: digest.digest().encodeHex().toString()]
            }.sort { it.coordinate }
            def destination = rootProject.findProperty('verifierInventoryOutput')
            if (!destination) throw new GradleException('Explicit verifierInventoryOutput is required')
            new File(destination.toString()).text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([schema_version:1, artifacts:files])) + '\n'
        }
    }
}
