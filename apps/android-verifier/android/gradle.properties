org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false

# Per-exec build proxies must never survive in a reused daemon.
org.gradle.daemon=false
# Never let AGP expand the approved SDK package inventory implicitly.
android.builder.sdkDownload=false
