[package]
name = "desktop-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
model-store = { path = "../model-store" }
runtime-cli = { path = "../runtime-cli" }
runtime-api = { path = "../runtime-api" }
runtime-types = { path = "../runtime-types" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
hyper.workspace = true
http-body-util.workspace = true
uuid.workspace = true
sha2.workspace = true
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects"] }

[dev-dependencies]
tempfile.workspace = true
hyper-util.workspace = true
bytes.workspace = true

[[bin]]
name = "nexa-desktop-harness"
path = "src/bin/harness.rs"

[[bin]]
name = "nexa-catalog-download-verify"
path = "src/bin/catalog_download_verify.rs"
