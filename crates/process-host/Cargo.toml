[package]
name = "process-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
runtime-types = { path = "../runtime-types" }
runtime-core = { path = "../runtime-core" }
runtime-ipc = { path = "../runtime-ipc" }
uuid.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "nexa-process-harness"
path = "src/bin/harness.rs"

[[bin]]
name = "nexa-fault-worker"
path = "src/bin/fault_worker.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Console"] }

[lints]
workspace = true
